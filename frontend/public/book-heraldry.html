<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Law Book — Герб України</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #040d18; overflow: hidden; }
  #vignette {
    position: fixed; inset: 0; pointer-events: none; z-index: 5;
    background: radial-gradient(ellipse 70% 70% at 50% 50%, transparent 40%, rgba(4,13,24,0.65) 100%);
  }
  #hint {
    position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%);
    color: rgba(200,168,67,0.35); font-family: 'Courier New', monospace;
    font-size: 10px; letter-spacing: 0.16em; pointer-events: none;
    text-transform: uppercase; z-index: 10;
  }
</style>
</head>
<body>
<div id="vignette"></div>
<div id="hint">drag to rotate &nbsp;·&nbsp; scroll to zoom</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls }   from 'three/addons/controls/OrbitControls.js';
import { SVGLoader }        from 'three/addons/loaders/SVGLoader.js';
import { EffectComposer }  from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass }      from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

/* ── SVG paths from TryzubMark.tsx ─────────────────────── */
// Shield (viewBox 0 0 96 128)
const SHIELD_D = `M20 6H76C82.627 6 88 11.373 88 18V69C88 92.154 75.881 109.831 48 122C20.119 109.831 8 92.154 8 69V18C8 11.373 13.373 6 20 6Z`;

// Tryzub glyph
const TRYZUB_D = `m 121 1 c -9.32 10.58 -15 24.42 -15 39.62 0.55 33.37 4.64 66.7 5 100 0.74 31.1 -8.58 60.3 -19.92 88.8 -3.78 7.87 -7.86 15.57 -11.95 23.29 l -12 -2.42 c -10.83 -2.16 -17.87 -12.69 -15.7 -23.52 1.89 -9.47 10.23 -16.1 19.53 -16.1 l 4.38 0.47 l -9.77 -81.6 c -3.19 -36.3 -21.93 -68.2 -49.5 -88.9 -4.74 -3.56 -9.77 -6.82 -15 -9.69 v 289.7 h 66.88 c 5 27.1 19.94 50.8 40.94 67 4.99 3.44 9.18 7.98 12.19 13.28 3 -5.3 7.19 -9.84 12.19 -13.28 21 -16.24 35.94 -39.89 40.94 -67 h 66.88 v -289.7 c -5.23 2.87 -10.26 6.13 -15 9.69 -27.6 20.73 -46.3 52.6 -49.5 88.9 l -9.77 81.6 l 4.38 -0.47 c 9.3 0.04 17.64 6.62 19.53 16.1 2.16 10.83 -4.88 21.35 -15.7 23.52 l -12 2.42 c -4.09 -7.71 -8.18 -15.41 -11.95 -23.29 -11.35 -28.48 -20.67 -57.68 -19.93 -88.8 0.36 -33.4 4.45 -66.7 5 -100 0 -15.2 -5.68 -29 -15 -39.62 z m -100 71.7 c 12.94 15.19 21.63 34.1 24.2 54.93 l 8 67.3 c -10.25 5.1 -18 14.46 -20.94 25.79 h -11.33 v -148 z m 200 0 v 148 h -11.33 c -2.92 -11.32 -10.69 -20.68 -20.94 -25.79 l 8 -67.3 c 2.59 -20.81 11.28 -39.74 24.2 -54.94 z m -100 135.3 c 5.37 17.57 12.76 34.3 21.95 49.78 -8.74 2.65 -16.34 7.81 -21.95 14.76 -5.61 -6.95 -13.21 -12.1 -21.95 -14.77 9.19 -15.51 16.58 -32.2 21.95 -49.77 z m -100 32.74 h 11.33 c 3.57 13.81 14.35 24.71 28 28.52 l 9.61 2.19 c -2.57 9.32 -3.98 19.1 -3.98 29.3 h -45 v -60 z m 188.7 0 h 11.33 v 60 h -45 c 0 -10.14 -1.41 -19.97 -3.98 -29.3 l 9.61 -2.19 c 13.7 -3.81 24.47 -14.72 28 -28.52 z m -120.2 35.3 c 12.13 1.71 21.48 12.1 21.48 24.69 h -25 c 0 -8.57 1.27 -16.84 3.52 -24.69 z m 62.97 0 c 2.25 7.85 3.52 16.1 3.52 24.69 h -25 c 0 -12.61 9.35 -22.98 21.48 -24.69 z m -64.2 44.7 h 22.73 v 42.1 c -11 -11.55 -19 -26 -22.73 -42.1 z m 42.73 0 h 22.73 c -3.68 16.1 -11.7 30.57 -22.73 42.1 v -42.1 z`;

/* ── Geometry helpers ───────────────────────────────────── */
function parseSvgGeo(d, depth, bevelT, bevelS, targetH, flipY = true) {
  const loader = new SVGLoader();
  const parsed = loader.parse(`<svg xmlns="http://www.w3.org/2000/svg"><path d="${d}"/></svg>`);
  const shapes = SVGLoader.createShapes(parsed.paths[0]);
  const geo = new THREE.ExtrudeGeometry(shapes, {
    depth, bevelEnabled: true,
    bevelThickness: bevelT, bevelSize: bevelS, bevelSegments: 5,
  });
  geo.computeBoundingBox();
  const b  = geo.boundingBox;
  const cx = (b.min.x + b.max.x) / 2;
  const cy = (b.min.y + b.max.y) / 2;
  const sc = targetH / (b.max.y - b.min.y);
  geo.translate(-cx, -cy, 0);
  geo.scale(sc, sc, 1);
  geo.computeVertexNormals();
  return { geo, sc };
}

/* ── Build coat of arms group ──────────────────────────── */
function buildHerb() {
  const group = new THREE.Group();

  // 1 ── Gold outer border ring (slightly larger than shield)
  const { geo: borderGeo } = parseSvgGeo(SHIELD_D, 0.015, 0.006, 0.004, 1.08, true);
  const borderMat = new THREE.MeshStandardMaterial({
    color: 0xc8a843, roughness: 0.04, metalness: 1.0,
    emissive: new THREE.Color(0xc8a843), emissiveIntensity: 0.5,
    side: THREE.DoubleSide,
  });
  const border = new THREE.Mesh(borderGeo, borderMat);
  border.rotation.z = Math.PI;   // flip Y
  border.position.z = -0.008;
  group.add(border);

  // 2 ── Blue shield body
  const { geo: shieldGeo } = parseSvgGeo(SHIELD_D, 0.055, 0.010, 0.006, 1.00, true);
  const shieldMat = new THREE.MeshStandardMaterial({
    color: 0x0e3a80, roughness: 0.25, metalness: 0.45,
    emissive: new THREE.Color(0x0d2d60), emissiveIntensity: 0.15,
    side: THREE.DoubleSide,
  });
  const shield = new THREE.Mesh(shieldGeo, shieldMat);
  shield.rotation.z = Math.PI;   // flip Y
  group.add(shield);

  // 3 ── Gold tryzub on top of shield
  const { geo: tryzubGeo } = parseSvgGeo(TRYZUB_D, 0.05, 0.012, 0.008, 0.72, true);
  const tryzubMat = new THREE.MeshStandardMaterial({
    color: 0xf2d060, roughness: 0.04, metalness: 1.0, side: THREE.DoubleSide,
    emissive: new THREE.Color(0xd4a020), emissiveIntensity: 0.55,
  });
  const tryzub = new THREE.Mesh(tryzubGeo, tryzubMat);
  tryzub.rotation.z = Math.PI;   // flip Y
  tryzub.position.set(0, 0.04, 0.065);  // sit in front of shield
  group.add(tryzub);

  return { group, shieldMat, tryzubMat, borderMat };
}

/* ── Renderer ───────────────────────────────────────────── */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.2;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

/* ── Scene ──────────────────────────────────────────────── */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x040d18);
scene.fog = new THREE.FogExp2(0x040d18, 0.048);

/* ── Camera ─────────────────────────────────────────────── */
const camera = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, 0.1, 100);
// View from the BACK side of the book
camera.position.set(-1.8, 3.2, -7.0);
camera.lookAt(0, 1.3, 0);

/* ── Bloom ──────────────────────────────────────────────── */
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.95, 0.6, 0.74);
composer.addPass(bloom);

/* ── Controls ───────────────────────────────────────────── */
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.04;
controls.target.set(0, 1.3, 0);
controls.minDistance = 3;
controls.maxDistance = 14;
controls.maxPolarAngle = Math.PI * 0.60;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.28;
controls.update();

/* ── Lights ─────────────────────────────────────────────── */
scene.add(new THREE.AmbientLight(0x08152a, 1.8));

const goldGlow = new THREE.PointLight(0xd4a020, 7, 9, 2);
goldGlow.position.set(0, 0.2, 0);
scene.add(goldGlow);

// Blue key light from BEHIND (now front of our camera)
const keyLight = new THREE.PointLight(0x1a4488, 3.5, 16, 1.5);
keyLight.position.set(3, 6, -7);
scene.add(keyLight);

// Gold rim from front (now behind the book from camera POV)
const rimLight = new THREE.PointLight(0xd4a020, 2.5, 12, 2);
rimLight.position.set(-4, 5, 5);
scene.add(rimLight);

// Spot from top — casts shadows
const spot = new THREE.SpotLight(0xfff6e0, 4, 20, 0.25, 0.7, 1.5);
spot.position.set(1, 10, -6);
spot.target.position.set(0, 1.5, 0);
spot.castShadow = true;
spot.shadow.mapSize.setScalar(2048);
spot.shadow.bias = -0.001;
scene.add(spot, spot.target);

// Subtle blue shield glow light (from front of shield, toward camera)
const shieldLight = new THREE.PointLight(0x1152a4, 3.5, 8, 2);
shieldLight.position.set(0, 1.5, -2.5);
scene.add(shieldLight);

scene.add(new THREE.PointLight(0x0d2d5a, 2, 14, 2));

/* ── Book ───────────────────────────────────────────────── */
const bookGroup = new THREE.Group();
const BW = 1.65, BH = 2.25, BD = 0.40;

const mCover = new THREE.MeshStandardMaterial({ color: 0x060f1c, roughness: 0.18, metalness: 0.45 });
const mPages = new THREE.MeshStandardMaterial({ color: 0xcfc2a8, roughness: 0.95, metalness: 0.0  });
const mSpine = new THREE.MeshStandardMaterial({ color: 0x040b15, roughness: 0.30, metalness: 0.60 });

// +X pages, -X spine, +Y top, -Y bot, +Z front cover, -Z back cover
const book = new THREE.Mesh(
  new THREE.BoxGeometry(BW, BH, BD),
  [mPages, mSpine, mPages, mPages, mCover, mCover]
);
book.castShadow = true;
bookGroup.add(book);

// Gold frame on BACK cover (-Z face, so offset in -Z)
const fMat = new THREE.MeshStandardMaterial({
  color: 0xc8a843, roughness: 0.04, metalness: 1.0,
  emissive: new THREE.Color(0xc8a843), emissiveIntensity: 0.25,
});
const mg = 0.12, ft = 0.024, fd = 0.007;
const addBar = (w, h, x, y) => {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, fd), fMat);
  m.position.set(x, y, BD/2 + fd/2);    // front face (camera-facing after book π rotation)
  bookGroup.add(m);
};
addBar(BW - 2*mg, ft,  0,  BH/2 - mg - ft/2);
addBar(BW - 2*mg, ft,  0, -BH/2 + mg + ft/2);
addBar(ft, BH - 2*mg, -(BW/2 - mg - ft/2), 0);
addBar(ft, BH - 2*mg,   BW/2 - mg - ft/2,  0);

// Corner dots
[-1, 1].forEach(sx => [-1, 1].forEach(sy => {
  const dot = new THREE.Mesh(new THREE.CylinderGeometry(0.02, 0.02, fd, 12), fMat);
  dot.rotation.x = Math.PI / 2;
  dot.position.set(sx*(BW/2-mg-0.008), sy*(BH/2-mg-0.008), BD/2 + fd/2);
  bookGroup.add(dot);
}));

// Spine lines
const spLineMat = new THREE.MeshStandardMaterial({ color: 0xc8a843, roughness: 0.05, metalness: 1 });
[0.60, -0.60].forEach(y => {
  const line = new THREE.Mesh(new THREE.BoxGeometry(BD - 0.05, 0.014, 0.004), spLineMat);
  line.rotation.y = Math.PI / 2;
  line.position.set(-BW/2 + 0.002, y, 0);
  bookGroup.add(line);
});

// ── Coat of arms on back cover ──
const { group: herbGroup, shieldMat, tryzubMat, borderMat } = buildHerb();
herbGroup.position.set(0, 0.1, BD/2 + 0.04);   // local +Z face → world -Z toward camera after bookGroup π rotation
bookGroup.add(herbGroup);

// Book starts showing back side (rotated 180° around Y)
bookGroup.rotation.y = Math.PI;
bookGroup.position.set(0, 1.45, 0);
scene.add(bookGroup);

/* ── Pedestal ───────────────────────────────────────────── */
const pedGroup = new THREE.Group();

pedGroup.add(new THREE.Mesh(
  new THREE.CylinderGeometry(1.65, 1.4, 0.09, 96),
  new THREE.MeshStandardMaterial({ color: 0x08080a, roughness: 0.15, metalness: 0.95 })
));

const plinth = new THREE.Mesh(
  new THREE.CylinderGeometry(0.70, 0.90, 0.30, 48),
  new THREE.MeshStandardMaterial({ color: 0x0c0b00, roughness: 0.22, metalness: 0.85 })
);
plinth.position.y = 0.195; pedGroup.add(plinth);

const oRingMat = new THREE.MeshStandardMaterial({ color: 0xd4a020, roughness: 0.03, metalness: 1, emissive: new THREE.Color(0xd4a020), emissiveIntensity: 0.85 });
const oRing = new THREE.Mesh(new THREE.TorusGeometry(1.57, 0.030, 14, 96), oRingMat);
oRing.rotation.x = Math.PI/2; oRing.position.y = 0.047; pedGroup.add(oRing);

const mRingMat = new THREE.MeshStandardMaterial({ color: 0xc8a843, roughness: 0.08, metalness: 1, emissive: new THREE.Color(0xc8a843), emissiveIntensity: 0.4 });
const mRing = new THREE.Mesh(new THREE.TorusGeometry(1.25, 0.014, 10, 96), mRingMat);
mRing.rotation.x = Math.PI/2; mRing.position.y = 0.049; pedGroup.add(mRing);

const iRing = new THREE.Mesh(new THREE.TorusGeometry(0.88, 0.012, 10, 72), mRingMat.clone());
iRing.rotation.x = Math.PI/2; iRing.position.y = 0.325; pedGroup.add(iRing);

const glowMat = new THREE.MeshStandardMaterial({
  color: 0xd4a020, emissive: new THREE.Color(0xd4a020), emissiveIntensity: 3.2,
  transparent: true, opacity: 0.60, roughness: 0, metalness: 0, depthWrite: false,
});
const glowDisk = new THREE.Mesh(new THREE.CylinderGeometry(0.68, 0.68, 0.006, 72), glowMat);
glowDisk.position.y = 0.345; pedGroup.add(glowDisk);

const haloMat = new THREE.MeshStandardMaterial({
  color: 0xd4a020, emissive: new THREE.Color(0xd4a020), emissiveIntensity: 0.6,
  transparent: true, opacity: 0.08, roughness: 0, metalness: 0, depthWrite: false, side: THREE.DoubleSide,
});
const halo = new THREE.Mesh(new THREE.CylinderGeometry(1.55, 1.55, 0.003, 96), haloMat);
halo.position.y = 0.047; pedGroup.add(halo);

scene.add(pedGroup);

const shadowPlane = new THREE.Mesh(new THREE.CircleGeometry(5, 64), new THREE.ShadowMaterial({ opacity: 0.55 }));
shadowPlane.rotation.set(-Math.PI/2, 0, 0);
shadowPlane.position.set(0, -0.06, 0);
shadowPlane.receiveShadow = true;
scene.add(shadowPlane);

/* ── Particles ──────────────────────────────────────────── */
const DUST_N = 600;
const dustPos = new Float32Array(DUST_N * 3), dustVel = new Float32Array(DUST_N);
for (let i = 0; i < DUST_N; i++) {
  const a = Math.random()*Math.PI*2, r = 0.3+Math.random()*3.0;
  dustPos[i*3]=Math.cos(a)*r; dustPos[i*3+1]=-0.5+Math.random()*6.0; dustPos[i*3+2]=Math.sin(a)*r;
  dustVel[i]=0.0015+Math.random()*0.003;
}
const dustGeo = new THREE.BufferGeometry();
dustGeo.setAttribute('position', new THREE.BufferAttribute(dustPos, 3));
const dustMesh = new THREE.Points(dustGeo, new THREE.PointsMaterial({
  color: 0xd4a020, size: 0.028, transparent: true, opacity: 0.45,
  sizeAttenuation: true, blending: THREE.AdditiveBlending, depthWrite: false,
}));
scene.add(dustMesh);

// Blue particles — echo the shield colour
const BLUE_N = 180;
const bluePos = new Float32Array(BLUE_N * 3), blueVel = new Float32Array(BLUE_N);
for (let i = 0; i < BLUE_N; i++) {
  const a = Math.random()*Math.PI*2, r = 0.5+Math.random()*2.0;
  bluePos[i*3]=Math.cos(a)*r; bluePos[i*3+1]=0.5+Math.random()*4.0; bluePos[i*3+2]=Math.sin(a)*r;
  blueVel[i]=0.002+Math.random()*0.003;
}
const blueGeo = new THREE.BufferGeometry();
blueGeo.setAttribute('position', new THREE.BufferAttribute(bluePos, 3));
const blueMesh = new THREE.Points(blueGeo, new THREE.PointsMaterial({
  color: 0x4488ff, size: 0.022, transparent: true, opacity: 0.35,
  sizeAttenuation: true, blending: THREE.AdditiveBlending, depthWrite: false,
}));
scene.add(blueMesh);

const SPARK_N = 60;
const sparkPos = new Float32Array(SPARK_N * 3);
for (let i = 0; i < SPARK_N; i++) {
  const a=(i/SPARK_N)*Math.PI*2, r=1.3+Math.random()*0.5;
  sparkPos[i*3]=Math.cos(a)*r; sparkPos[i*3+1]=0.05+Math.random()*0.3; sparkPos[i*3+2]=Math.sin(a)*r;
}
const sparkGeo = new THREE.BufferGeometry();
sparkGeo.setAttribute('position', new THREE.BufferAttribute(sparkPos, 3));
const sparkMesh = new THREE.Points(sparkGeo, new THREE.PointsMaterial({
  color: 0xffe070, size: 0.08, transparent: true, opacity: 0.90,
  sizeAttenuation: true, blending: THREE.AdditiveBlending, depthWrite: false,
}));
scene.add(sparkMesh);

const EMBER_N = 28;
const emberPos = new Float32Array(EMBER_N*3), emberVel = new Float32Array(EMBER_N);
for (let i=0;i<EMBER_N;i++){
  const a=Math.random()*Math.PI*2, r=0.4+Math.random()*1.0;
  emberPos[i*3]=Math.cos(a)*r; emberPos[i*3+1]=Math.random()*3.5; emberPos[i*3+2]=Math.sin(a)*r;
  emberVel[i]=0.006+Math.random()*0.006;
}
const emberGeo = new THREE.BufferGeometry();
emberGeo.setAttribute('position', new THREE.BufferAttribute(emberPos, 3));
const emberMesh = new THREE.Points(emberGeo, new THREE.PointsMaterial({
  color: 0xff9020, size: 0.14, transparent: true, opacity: 0.7,
  sizeAttenuation: true, blending: THREE.AdditiveBlending, depthWrite: false,
}));
scene.add(emberMesh);

/* ── Resize ─────────────────────────────────────────────── */
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  composer.setSize(innerWidth, innerHeight);
});

/* ── Animate ─────────────────────────────────────────────── */
let t = 0;
function animate() {
  requestAnimationFrame(animate);
  t += 0.011;
  controls.update();

  bookGroup.position.y  = 1.45 + Math.sin(t*0.65)*0.11;
  bookGroup.rotation.y  = Math.PI + Math.sin(t*0.24)*0.11;   // stay showing back

  goldGlow.intensity        = 6.5 + Math.sin(t*1.55)*1.5;
  glowMat.emissiveIntensity = 3.0 + Math.sin(t*1.55)*0.8;
  haloMat.opacity           = 0.06 + Math.abs(Math.sin(t*0.8))*0.05;

  // Shield blue pulse
  shieldMat.emissiveIntensity = 0.12 + Math.sin(t*1.2)*0.08;
  shieldLight.intensity       = 3.2 + Math.sin(t*1.4)*1.0;

  // Tryzub shimmer
  tryzubMat.emissiveIntensity = 0.48 + Math.sin(t*2.2)*0.22;
  borderMat.emissiveIntensity = 0.45 + Math.sin(t*1.8)*0.2;

  // Dust rise
  const da = dustGeo.attributes.position.array;
  for (let i=0;i<DUST_N;i++){da[i*3+1]+=dustVel[i]; if(da[i*3+1]>5.5)da[i*3+1]=-0.5;}
  dustGeo.attributes.position.needsUpdate=true;
  dustMesh.rotation.y+=0.0006;

  // Blue particles rise
  const ba = blueGeo.attributes.position.array;
  for (let i=0;i<BLUE_N;i++){ba[i*3+1]+=blueVel[i]; if(ba[i*3+1]>5.0)ba[i*3+1]=0.5;}
  blueGeo.attributes.position.needsUpdate=true;
  blueMesh.rotation.y-=0.0004;

  // Sparks orbit
  const sa = sparkGeo.attributes.position.array;
  for (let i=0;i<SPARK_N;i++){
    const ang=(i/SPARK_N)*Math.PI*2+t*0.20, r=1.35+Math.sin(t*2.5+i*0.7)*0.22;
    sa[i*3]=Math.cos(ang)*r; sa[i*3+2]=Math.sin(ang)*r;
    sa[i*3+1]=0.08+Math.abs(Math.sin(t*3.5+i*0.9))*0.35;
  }
  sparkGeo.attributes.position.needsUpdate=true;

  // Embers rise
  const ea = emberGeo.attributes.position.array;
  for (let i=0;i<EMBER_N;i++){
    ea[i*3+1]+=emberVel[i];
    if(ea[i*3+1]>4.0){
      const a=Math.random()*Math.PI*2, r=0.4+Math.random()*0.8;
      ea[i*3]=Math.cos(a)*r; ea[i*3+1]=0; ea[i*3+2]=Math.sin(a)*r;
    }
  }
  emberGeo.attributes.position.needsUpdate=true;

  composer.render();
}
animate();
</script>
</body>
</html>
