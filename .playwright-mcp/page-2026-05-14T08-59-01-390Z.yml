          - article [ref=e177]:
            - generic [ref=e179]:
              - generic [ref=e180]: Стаття 11
              - link "Держава сприяє консолідації та розвиткові української нації, її історичної свідомості, традицій і культури, а також розвиткові етнічної, культурної, мовної та релігійної самобутності всіх корінних народів і національних меншин України." [ref=e181] [cursor=pointer]:
