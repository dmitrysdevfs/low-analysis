                - generic [ref=e219]: Стаття 17
                - link "Захист суверенітету і територіальної цілісності України, забезпечення її економічної та інформаційної безпеки є найважливішими функціями держави, справою всього Українського народу." [ref=e220] [cursor=pointer]:
