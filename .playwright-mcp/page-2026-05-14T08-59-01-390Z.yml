          - article [ref=e182]:
            - generic [ref=e184]:
              - generic [ref=e185]: Стаття 12
              - link "Україна дбає про задоволення національно-культурних і мовних потреб українців, які проживають за межами держави." [ref=e186] [cursor=pointer]:
                - /url: /laws/69f84aa7395f1789bc7b2b89/articles/12
          - article [ref=e187]:
            - generic [ref=e188]:
              - generic [ref=e189]:
                - generic [ref=e190]: Стаття 13
                - link "Земля, її надра, атмосферне повітря, водні та інші природні ресурси, які знаходяться в межах території України, природні ресурси її континентального шельфу, виключної (морської) економічної зони є об'єктами права власності Українського народу. Від імені Українського народу права власника здійснюють органи державної влади та органи місцевого самоврядування в межах, визначених цією Конституцією." [ref=e191] [cursor=pointer]:
                  - /url: /laws/69f84aa7395f1789bc7b2b89/articles/13
              - button "Показати структуру 3 ел." [ref=e192] [cursor=pointer]:
