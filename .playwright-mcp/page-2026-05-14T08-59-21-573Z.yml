                  - generic [ref=e101]:
                    - generic [ref=e102]: ч. 3
                    - generic [ref=e104]: 3. У разі встановлення факту настання смерті поліцейського, а також особи, звільненої зі служби в поліції, внаслідок обставин, зазначених у пунктах 3-6 частини першої статті 97 цього Закону, якщо смерть настала протягом шести місяців після отримання інвалідності чи травми, внаслідок отримання яких поліцейський раніше отримував одноразову грошову допомогу згідно із зазначеними пунктами, виплата одноразової грошової допомоги особам, які мають право на її призначення та отримання, зазначеним у цьому Законі, здійснюється з вирахуванням суми допомоги, отриманої померлим.
                  - generic [ref=e105]:
