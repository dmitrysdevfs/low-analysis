                      - generic [ref=e75]: 1. Одноразова грошова допомога у випадках, передбачених пунктами 1 і 2 частини першої статті 97 цього Закону, за відсутності особистого розпорядження призначається і виплачується рівними частками всім особам, які мають право на її призначення та отримання, за їх особистою заявою або заявою їх законних представників.
                      - generic [ref=e76]:
                        - generic [ref=e77]:
                          - generic [ref=e78]: абз. 1
