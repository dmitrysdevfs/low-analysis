                      - generic [ref=e121]: 6. Міністерство внутрішніх справ України, органи Національної поліції безоплатно в порядку електронної взаємодії отримують необхідну інформацію від державних органів, які є власниками (розпорядниками, держателями, володільцями, адміністраторами тощо) інформаційних (автоматизованих), інформаційно-комунікаційних, комунікаційних і довідкових систем, реєстрів та банків даних, у тому числі з Єдиного державного демографічного реєстру, Державного реєстру актів цивільного стану громадян, Єдиного державного реєстру судових рішень, Єдиного реєстру осіб, зниклих безвісти за особливих обставин, банку даних про дітей-сиріт, дітей, позбавлених батьківського піклування, і сім’ї потенційних усиновлювачів, опікунів, піклувальників, прийомних батьків, батьків-вихователів тощо, про осіб, які мають право на отримання одноразової грошової допомоги.
