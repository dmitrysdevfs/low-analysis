                        - generic [ref=e81]:
                          - generic [ref=e82]: абз. 2
                          - generic [ref=e84]: Одноразова грошова допомога у випадках, передбачених пунктами 1 і 2 частини першої статті 97 цього Закону, за наявності особистого розпорядження виплачується особі (особам), на користь якої (яких) складено особисте розпорядження, у розмірі частки, визначеної в такому розпорядженні. У таких випадках розмір часток обраховується із суми, що залишилася після виплат, визначених абзацом другим частини другої статті 98 цього Закону.
                        - generic [ref=e85]:
                          - generic [ref=e86]: абз. 3
                          - generic [ref=e88]: У разі відмови однієї з осіб, визначених в особистому розпорядженні, від отримання одноразової грошової допомоги, а також якщо одна з таких осіб у строк, встановлений частиною восьмою цієї статті, не реалізувала своє право на призначення та отримання такої допомоги, її частка розподіляється між іншими особами, які мають право на призначення та отримання одноразової грошової допомоги, у рівних частках.
                        - generic [ref=e89]:
                          - generic [ref=e90]: абз. 4
                          - generic [ref=e92]: Відмова від призначення та отримання одноразової грошової допомоги від імені малолітніх, неповнолітніх дітей загиблої (померлої) особи, а також недієздатних осіб та осіб, цивільна дієздатність яких обмежена, які мають право на призначення та отримання одноразової грошової допомоги, не допускається.
