                    - generic [ref=e130]: 7. Якщо особа одночасно має право на призначення та отримання одноразової грошової допомоги з підстав, визначених цим Законом, та одноразової грошової допомоги або компенсаційної виплати, визначених з різних підстав іншими законами та нормативно-правовими актами, виплата грошових сум здійснюється за однією з підстав за вибором такої особи.
