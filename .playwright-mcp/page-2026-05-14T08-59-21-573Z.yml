                    - generic [ref=e107]:
                      - generic [ref=e108]: 4. У разі визначення інвалідності або часткової втрати працездатності без визначення інвалідності поліцейському, особі, звільненій зі служби в органах поліції, який (яка) на день отримання інвалідності, визначення відсотка часткової втрати працездатності без визначення інвалідності або на день його (її) звільнення з органів поліції займав (займала) посаду в державному органі, установі, організації або у закладі вищої освіти, які виконують роботу в інтересах держави та її безпеки, із залишенням на службі в поліції, виплата одноразової грошової допомоги здійснюється за рахунок коштів тих органів державної влади, до яких вони були відряджені.
