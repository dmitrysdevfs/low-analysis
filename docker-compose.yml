version: "3.8"

services:
  mongodb:
    image: mongo:7.0
    container_name: low-analysis-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

  backend:
    image: node:20
    container_name: low-analysis-backend
    working_dir: /app
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      MONGODB_URI: mongodb://mongodb:27017/low_analysis
    depends_on:
      - mongodb
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
    command: sh -c "npm install && npm run dev"

  frontend:
    image: node:20
    container_name: low-analysis-frontend
    working_dir: /app
    ports:
      - "3001:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://backend:3000
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    command: sh -c "npm install && npm run dev"

volumes:
  mongodb_data:
  backend_node_modules:
  frontend_node_modules: